# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: wordpress.org plugin page

on:
  workflow_call:
    inputs:
      SVN_PLUGIN_SLUG:
        description: "WordPress.org plugin slug (e.g., 'woocommerce')"
        type: string
        required: true

      GIT_REF:
        description: "Git ref to read readme.txt and the assets directory from (tag, branch, or commit)"
        type: string
        required: true

      SYNC_README:
        description: "Update readme.txt in SVN trunk and in the tag referenced by 'Stable tag'"
        type: boolean
        default: true
        required: false

      SYNC_ASSETS:
        description: "Mirror ASSETS_DIR to the SVN /assets directory (banners, icons, screenshots, blueprints)"
        type: boolean
        default: true
        required: false

      ASSETS_DIR:
        description: "Directory in the Git repository holding the WordPress.org assets"
        type: string
        default: ".wordpress-org"
        required: false

      DRY_RUN:
        description: "Create artifact with the prepared changes instead of committing to SVN"
        type: boolean
        default: false
        required: false

    secrets:
      SVN_USERNAME:
        required: true

      SVN_PASSWORD:
        required: true

jobs:
  update_plugin_page:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install required tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y subversion rsync jq

      - name: Validate inputs
        env:
          SVN_PLUGIN_SLUG: ${{ inputs.SVN_PLUGIN_SLUG }}
          GIT_REF: ${{ inputs.GIT_REF }}
          SYNC_README: ${{ inputs.SYNC_README }}
          SYNC_ASSETS: ${{ inputs.SYNC_ASSETS }}
          ASSETS_DIR: ${{ inputs.ASSETS_DIR }}
        run: |
          set -euo pipefail

          if [[ ! "$SVN_PLUGIN_SLUG" =~ ^[a-z0-9-]+$ ]]; then
            echo "❌ Invalid plugin slug: $SVN_PLUGIN_SLUG"
            echo "   WordPress.org slugs may only contain lowercase letters, numbers, and hyphens"
            exit 1
          fi

          echo "✅ Valid plugin slug: $SVN_PLUGIN_SLUG"

          if ! git check-ref-format --allow-onelevel "$GIT_REF"; then
            echo "❌ Invalid Git ref name: $GIT_REF"
            exit 1
          fi

          if [ "$SYNC_README" != "true" ] && [ "$SYNC_ASSETS" != "true" ]; then
            echo "❌ Nothing to do: both SYNC_README and SYNC_ASSETS are disabled"
            exit 1
          fi

          # ASSETS_DIR is used as an rsync source, so keep it inside the repository.
          if [[ ! "$ASSETS_DIR" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] || [[ "/$ASSETS_DIR/" == *"/../"* ]]; then
            echo "❌ Invalid ASSETS_DIR: $ASSETS_DIR"
            echo "   Must be a relative path inside the repository, without '..' segments"
            exit 1
          fi

          echo "✅ Inputs are valid"
        # GIT_REF is validated above, so it is safe to pass it to actions/checkout directly.

      - name: Checkout git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.GIT_REF }}
          persist-credentials: false

      - name: Resolve Git revision
        id: git_revision
        run: |
          set -euo pipefail
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate readme.txt
        id: readme
        if: inputs.SYNC_README
        run: |
          set -euo pipefail

          if [ ! -f readme.txt ]; then
            echo "❌ readme.txt not found"
            exit 1
          fi

          STABLE_TAG=$(grep -m1 -iE '^[[:space:]]*([*+-][[:space:]]+)?Stable tag:' readme.txt \
            | sed -E 's/^.*Stable tag:[[:space:]]*//I; s/[[:space:]]+$//' | tr -d '\r' || true)

          if [ -z "$STABLE_TAG" ]; then
            echo "❌ Could not extract 'Stable tag:' from readme.txt"
            exit 1
          fi

          if [ "$STABLE_TAG" = "trunk" ]; then
            echo "❌ 'Stable tag: trunk' is not supported (and discouraged by WordPress.org)"
            exit 1
          fi

          # This workflow never creates versions, it only has to find the existing tag,
          # so any numeric dotted version is accepted here.
          if [[ ! "$STABLE_TAG" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "❌ Unexpected 'Stable tag' format in readme.txt: $STABLE_TAG"
            exit 1
          fi

          echo "STABLE_TAG=$STABLE_TAG" >> "$GITHUB_OUTPUT"
          echo "✅ readme.txt found, Stable tag: $STABLE_TAG"

      - name: Validate assets directory
        if: inputs.SYNC_ASSETS
        env:
          ASSETS_DIR: ${{ inputs.ASSETS_DIR }}
        run: |
          set -euo pipefail

          if [ ! -d "$ASSETS_DIR" ]; then
            echo "❌ Assets directory not found: $ASSETS_DIR"
            exit 1
          fi

          # Hidden files (.gitkeep, .DS_Store, ...) are ignored here and by the sync below.
          mapfile -t FILES < <(cd "$ASSETS_DIR" && find . -type f ! -path '*/.*' -printf '%P\n' | LC_ALL=C sort)

          # The sync mirrors this directory, so an empty directory would wipe the plugin page.
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "❌ Assets directory is empty: $ASSETS_DIR"
            echo "   Syncing it would delete every asset from WordPress.org. Aborting."
            exit 1
          fi

          # Mirrors the filename rules of the WordPress.org plugin directory importer,
          # restricted to the documented banner and icon resolutions.
          LOCALE='(-rtl)?(-[a-z]{2,3}(_[A-Z]{2})?(_[a-z0-9]+)?)?'
          RASTER='\.(png|jpg|jpeg|gif)'
          BANNER_RE="^banner-(772x250|1544x500)${LOCALE}${RASTER}$"
          ICON_RE="^icon-(128x128|256x256)${LOCALE}${RASTER}$"
          SCREENSHOT_RE="^screenshot-[0-9]+${LOCALE}${RASTER}$"
          BLUEPRINT_RE='^blueprints/blueprint[-A-Za-z0-9_]*\.json$'

          ERRORS=0
          HAS_RASTER_ICON=0
          HAS_SVG_ICON=0
          BLUEPRINT_COUNT=0

          for FILE in "${FILES[@]}"; do
            SIZE=$(stat -c %s "$ASSETS_DIR/$FILE")

            if [[ "$FILE" =~ $BANNER_RE ]]; then
              LIMIT=$((4 * 1024 * 1024))
            elif [[ "$FILE" =~ $ICON_RE ]]; then
              LIMIT=$((1 * 1024 * 1024))
              HAS_RASTER_ICON=1
            elif [ "$FILE" = "icon.svg" ]; then
              LIMIT=$((1 * 1024 * 1024))
              HAS_SVG_ICON=1
            elif [[ "$FILE" =~ $SCREENSHOT_RE ]]; then
              LIMIT=$((10 * 1024 * 1024))
            elif [[ "$FILE" =~ $BLUEPRINT_RE ]]; then
              LIMIT=$((100 * 1024))
              BLUEPRINT_COUNT=$((BLUEPRINT_COUNT + 1))
              if ! jq empty "$ASSETS_DIR/$FILE" 2>/dev/null; then
                echo "❌ $FILE is not valid JSON"
                ERRORS=1
              fi
            else
              LOWER=$(echo "$FILE" | tr '[:upper:]' '[:lower:]')
              if [[ "$LOWER" =~ $BANNER_RE ]] || [[ "$LOWER" =~ $ICON_RE ]] || [[ "$LOWER" =~ $SCREENSHOT_RE ]]; then
                echo "❌ $FILE must be lowercase (WordPress.org ignores uppercase asset names)"
              else
                echo "❌ $FILE is not a recognized WordPress.org asset and would be ignored by WordPress.org"
              fi
              ERRORS=1
              continue
            fi

            if [ "$SIZE" -eq 0 ]; then
              echo "❌ $FILE is empty"
              ERRORS=1
            elif [ "$SIZE" -gt "$LIMIT" ]; then
              echo "❌ $FILE is $SIZE bytes, WordPress.org limit is $LIMIT bytes"
              ERRORS=1
            fi
          done

          if [ "$HAS_SVG_ICON" = "1" ] && [ "$HAS_RASTER_ICON" = "0" ]; then
            echo "❌ icon.svg requires a PNG/JPG/GIF icon (icon-128x128 or icon-256x256) as fallback"
            ERRORS=1
          fi

          if [ "$BLUEPRINT_COUNT" -gt 10 ]; then
            echo "❌ $BLUEPRINT_COUNT blueprints found, WordPress.org imports at most 10"
            ERRORS=1
          fi

          [ "$ERRORS" = "1" ] && exit 1

          echo "✅ ${#FILES[@]} asset(s) in $ASSETS_DIR are valid"

      - name: Checkout SVN repository
        env:
          SVN_PLUGIN_SLUG: ${{ inputs.SVN_PLUGIN_SLUG }}
          SYNC_README: ${{ inputs.SYNC_README }}
          SYNC_ASSETS: ${{ inputs.SYNC_ASSETS }}
          STABLE_TAG: ${{ steps.readme.outputs.STABLE_TAG }}
        run: |
          set -euo pipefail

          export SVN_REPO_ROOT="${RUNNER_TEMP}/svn_repository/${SVN_PLUGIN_SLUG}"
          echo "SVN_REPO_ROOT=$SVN_REPO_ROOT" >> "$GITHUB_ENV"

          # Sparse checkout: only the files this workflow may change are fetched.
          # trunk and tags stay (nearly) empty, which keeps this fast for plugins with large histories.
          mkdir -p "$(dirname "$SVN_REPO_ROOT")"
          svn checkout "https://plugins.svn.wordpress.org/${SVN_PLUGIN_SLUG}" "$SVN_REPO_ROOT" --depth immediates
          cd "$SVN_REPO_ROOT"

          if [ "$SYNC_README" = "true" ]; then
            svn update trunk/readme.txt
            svn update tags --set-depth immediates

            if [ -d "tags/$STABLE_TAG" ]; then
              svn update "tags/$STABLE_TAG/readme.txt"
            fi
          fi

          if [ "$SYNC_ASSETS" = "true" ]; then
            if [ -d assets ]; then
              svn update assets --set-depth infinity
            else
              echo "ℹ️ No /assets directory in SVN yet, creating it"
              svn mkdir assets
            fi
          fi

      - name: Verify Stable tag matches WordPress.org
        if: inputs.SYNC_README
        env:
          SVN_PLUGIN_SLUG: ${{ inputs.SVN_PLUGIN_SLUG }}
          STABLE_TAG: ${{ steps.readme.outputs.STABLE_TAG }}
        run: |
          set -euo pipefail

          cd "$SVN_REPO_ROOT"

          if [ ! -f trunk/readme.txt ]; then
            echo "❌ trunk/readme.txt does not exist in SVN"
            exit 1
          fi

          SVN_STABLE_TAG=$(grep -m1 -iE '^[[:space:]]*([*+-][[:space:]]+)?Stable tag:' trunk/readme.txt \
            | sed -E 's/^.*Stable tag:[[:space:]]*//I; s/[[:space:]]+$//' | tr -d '\r' || true)

          # Changing the Stable tag means publishing a different version - that is a release.
          if [ "$STABLE_TAG" != "$SVN_STABLE_TAG" ]; then
            echo "❌ readme.txt Stable tag ($STABLE_TAG) does not match Stable tag in SVN trunk ($SVN_STABLE_TAG)"
            echo "   This workflow cannot change the Stable tag. Use the wordpress-org-release workflow to publish a new version,"
            echo "   or pass a GIT_REF whose readme.txt matches the currently published version."
            exit 1
          fi

          if [ ! -f "tags/$STABLE_TAG/readme.txt" ]; then
            echo "❌ tags/$STABLE_TAG/readme.txt does not exist in SVN"
            echo "   Check: https://plugins.svn.wordpress.org/${SVN_PLUGIN_SLUG}/tags/"
            exit 1
          fi

          echo "✅ Stable tag $STABLE_TAG matches SVN trunk and exists as a published tag"

      - name: Synchronize readme.txt
        if: inputs.SYNC_README
        env:
          STABLE_TAG: ${{ steps.readme.outputs.STABLE_TAG }}
        run: |
          set -euo pipefail

          cd "$SVN_REPO_ROOT"
          TAG_README="tags/$STABLE_TAG/readme.txt"

          # If trunk's readme already differs from the published one, trunk holds unreleased changes
          # (e.g. a trunk preview created by wordpress-org-release with UPDATE_TRUNK_ONLY).
          # Overwriting it would silently revert those, so trunk is left alone in that case.
          if cmp -s trunk/readme.txt "$TAG_README"; then
            TRUNK_IN_SYNC=true
          else
            TRUNK_IN_SYNC=false
          fi

          # The plugin page is rendered from the readme.txt of the Stable tag.
          cp "$GITHUB_WORKSPACE/readme.txt" "$TAG_README"
          echo "✅ Updated $TAG_README"

          if [ "$TRUNK_IN_SYNC" = "true" ]; then
            cp "$GITHUB_WORKSPACE/readme.txt" trunk/readme.txt
            echo "✅ Updated trunk/readme.txt"
          else
            echo "::warning title=trunk/readme.txt left unchanged::SVN trunk contains unreleased readme.txt changes (likely a trunk preview). Only $TAG_README was updated. Make sure the same change is part of the upcoming release."
          fi

      - name: Synchronize assets
        if: inputs.SYNC_ASSETS
        env:
          ASSETS_DIR: ${{ inputs.ASSETS_DIR }}
        run: |
          set -euo pipefail

          rsync -rc \
          --itemize-changes \
          --delete \
          --exclude='.*' \
          "$GITHUB_WORKSPACE/$ASSETS_DIR/" "$SVN_REPO_ROOT/assets/"

          cd "$SVN_REPO_ROOT"
          svn add assets --force --depth infinity --quiet

          MISSING=$(svn status assets | grep '^!' | cut -c9- || true)

          if [ -n "$MISSING" ]; then
            echo "$MISSING" | while IFS= read -r file; do
              svn delete "$file@"  # @ suffix handles files with @ in name
            done
          fi

          # Without a correct svn:mime-type, browsers download assets instead of displaying them.
          # 'svn add' marks binaries as application/octet-stream, so this also fixes newly added files.
          find assets -type f | while IFS= read -r file; do
            case "$file" in
              *.png) MIME_TYPE="image/png" ;;
              *.jpg|*.jpeg) MIME_TYPE="image/jpeg" ;;
              *.gif) MIME_TYPE="image/gif" ;;
              *.svg) MIME_TYPE="image/svg+xml" ;;
              *.json) MIME_TYPE="application/json" ;;
              *) continue ;;
            esac

            if [ "$(svn propget svn:mime-type "$file@" 2>/dev/null || true)" != "$MIME_TYPE" ]; then
              svn propset --quiet svn:mime-type "$MIME_TYPE" "$file@"
            fi
          done

      - name: Verify only plugin page files are changed
        env:
          STABLE_TAG: ${{ steps.readme.outputs.STABLE_TAG }}
        run: |
          set -euo pipefail

          cd "$SVN_REPO_ROOT"

          # Defense in depth: this workflow must never touch plugin code.
          # Literal matching (no regex), so version dots can't act as wildcards.
          UNEXPECTED=$(svn status | cut -c9- | while IFS= read -r path; do
            case "$path" in
              assets|assets/*|trunk/readme.txt|"tags/$STABLE_TAG/readme.txt") ;;
              *) echo "$path" ;;
            esac
          done)

          if [ -n "$UNEXPECTED" ]; then
            echo "❌ Unexpected changes outside of the plugin page files:"
            echo "$UNEXPECTED"
            exit 1
          fi

          echo "✅ Only plugin page files are changed"

      - name: Show SVN status
        id: svn_status
        run: |
          set -euo pipefail

          cd "$SVN_REPO_ROOT"
          svn status

          # Readme diffs are text and worth reviewing in the log; binary assets are listed by status only.
          for README in trunk/readme.txt tags/*/readme.txt; do
            if [ -f "$README" ]; then
              svn diff "$README"
            fi
          done

          # Content (first column) or property (second column) changes
          if svn status | grep -E '^([ADMR~]|.M)' >/dev/null; then
            echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_CHANGES=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes to SVN repository
        if: inputs.DRY_RUN == false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SYNC_README: ${{ inputs.SYNC_README }}
          SYNC_ASSETS: ${{ inputs.SYNC_ASSETS }}
          STABLE_TAG: ${{ steps.readme.outputs.STABLE_TAG }}
          GIT_REF: ${{ inputs.GIT_REF }}
          SHORT_SHA: ${{ steps.git_revision.outputs.SHORT_SHA }}
          HAS_CHANGES: ${{ steps.svn_status.outputs.HAS_CHANGES }}
        run: |
          set -euo pipefail

          # Unlike a release, updating the plugin page is idempotent: re-running without changes is fine.
          if [ "$HAS_CHANGES" != "true" ]; then
            echo "::notice title=No changes::The WordPress.org plugin page is already up to date"
            exit 0
          fi

          cd "$SVN_REPO_ROOT"

          COMMIT_PATHS=()
          UPDATED=()

          if [ "$SYNC_README" = "true" ]; then
            COMMIT_PATHS+=(trunk/readme.txt "tags/$STABLE_TAG/readme.txt")
            UPDATED+=(readme.txt)
          fi

          if [ "$SYNC_ASSETS" = "true" ]; then
            COMMIT_PATHS+=(assets)
            UPDATED+=(assets)
          fi

          COMMIT_MESSAGE="Update plugin page ($(IFS=,; echo "${UPDATED[*]}" | sed 's/,/, /g')) from ${GIT_REF}@${SHORT_SHA}"

          # WordPress.org SVN doesn't support SSH keys or tokens.
          # Keeping credentials as step-level env vars with --no-auth-cache is the best available option.
          echo '🚀 Committing...'

          svn commit "${COMMIT_PATHS[@]}" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --no-auth-cache \
            --non-interactive \
            -m "$COMMIT_MESSAGE"

          echo "✅ WordPress.org plugin page updated. Changes may take a few minutes (up to hours) to show due to CDN caching."

      - name: Prepare dry run preview
        if: inputs.DRY_RUN == true
        env:
          SYNC_ASSETS: ${{ inputs.SYNC_ASSETS }}
        run: |
          set -euo pipefail

          PREVIEW_DIR="${RUNNER_TEMP}/plugin_page_preview"
          echo "PREVIEW_DIR=$PREVIEW_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PREVIEW_DIR"

          cd "$SVN_REPO_ROOT"
          svn status > "$PREVIEW_DIR/svn-status.txt"
          svn diff > "$PREVIEW_DIR/changes.diff"

          for README in trunk/readme.txt tags/*/readme.txt; do
            if [ -f "$README" ]; then
              mkdir -p "$PREVIEW_DIR/$(dirname "$README")"
              cp "$README" "$PREVIEW_DIR/$README"
            fi
          done

          if [ "$SYNC_ASSETS" = "true" ]; then
            rsync -r --exclude='.svn' assets/ "$PREVIEW_DIR/assets/"
          fi

      - name: Upload dry run preview as an artifact
        if: inputs.DRY_RUN == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.SVN_PLUGIN_SLUG }}-plugin-page
          path: ${{ env.PREVIEW_DIR }}
          compression-level: 1 #Minimal compression - we don't want to waste resources for this
